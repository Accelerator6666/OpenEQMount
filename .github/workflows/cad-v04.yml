name: V0.4 DfAM orthogonal frame CAD
on:
  workflow_dispatch:
  push:
    paths:
      - 'hardware/cad/generate_v04.py'
      - 'tools/dfam_gate_v04.py'
      - 'tests/test_v04_frame.py'
      - 'docs/mechanical-v04-frame.md'
      - '.github/workflows/cad-v04.yml'
  pull_request:
    paths:
      - 'hardware/cad/generate_v04.py'
      - 'tools/dfam_gate_v04.py'
      - 'tests/test_v04_frame.py'
      - '.github/workflows/cad-v04.yml'
permissions:
  contents: write
jobs:
  generate-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CAD and verification dependencies
        run: python -m pip install 'cadquery>=2.5,<3' pytest trimesh
      - name: Unit test mechanical interfaces
        run: python -m pytest -q tests/test_v04_frame.py
      - name: Generate V0.4 printable gauges and metal reference STEP
        run: python hardware/cad/generate_v04.py --out hardware/cad/v04_generated
      - name: Mandatory DfAM Gate A (not structural approval)
        run: python tools/dfam_gate_v04.py --dir hardware/cad/v04_generated --report hardware/cad/v04_generated/dfam-gate-report.json
      - name: Render preview images (nonblocking visual aid)
        continue-on-error: true
        run: |
          python -m pip install vtk
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python tools/render_v04.py
          else
            python tools/render_v04.py
          fi
      - name: Sync generated V0.4 CAD files to GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A hardware/cad/v04_generated
          if git diff --cached --quiet; then
            echo 'V0.4 files are already up-to-date.'
          else
            git commit -m 'Generate V0.4 STEP STL and DfAM manifest [skip ci]'
            git push origin HEAD:main
          fi
      - name: Upload prototype artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenEQMount-V04-Gate-A-BENCH-ONLY-NOT-LOAD-RATED
          path: |
            hardware/cad/v04_generated/*.step
            hardware/cad/v04_generated/*.stl
            hardware/cad/v04_generated/*.json
            hardware/cad/v04_generated/*.png
          if-no-files-found: error
