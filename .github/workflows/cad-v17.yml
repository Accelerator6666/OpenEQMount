name: V1.7 three-axis 7008AWDB DEC-ROT integration Gate A
# Source-first STEP/STL CAD: digital Gate A only, no payload or motor clearance.
on:
  push:
    branches: [main]
    paths:
      - 'hardware/cad/generate_v17_integrated_7008.py'
      - 'tools/dfam_gate_v17.py'
      - 'tools/render_v17.py'
      - 'tests/test_v17_7008_mated_integration.py'
      - 'docs/mechanical-v17-dec-rot-db7008-integration.md'
      - '.github/workflows/cad-v17.yml'
  pull_request:
    paths:
      - 'hardware/cad/generate_v17_integrated_7008.py'
      - 'tools/dfam_gate_v17.py'
      - 'tests/test_v17_7008_mated_integration.py'
      - '.github/workflows/cad-v17.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v17-three-axis-digital-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  digital-cad-gate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install source and mesh validation dependencies
        run: python -m pip install 'cadquery>=2.5,<3' pytest trimesh matplotlib
      - name: Verify V1.7 kinematic/assembly and safety-gate source contract
        run: python -m pytest -p no:cacheprovider -q tests/test_v17_7008_mated_integration.py
      - name: Generate three-axis STEP, mated interface, nonload coupon and manifest
        run: python hardware/cad/generate_v17_integrated_7008.py --out hardware/cad/v17_generated
      - name: DfAM Gate A - digital only
        run: python tools/dfam_gate_v17.py --dir hardware/cad/v17_generated --report hardware/cad/v17_generated/dfam-gate-report.json
      - name: Full and subassembly STEP reimport validity check
        run: |
          python - <<'PY'
          from pathlib import Path
          import cadquery as cq
          root=Path('hardware/cad/v17_generated')
          for filename,count in [
              ('OpenEQMount_V17_THREE_AXIS_7008AWDB_INTERFACE_STUDY_UNQUALIFIED.step',52),
              ('OpenEQMount_V17_DEC_ROT_7008_AWDB_INTERFACE_SUBASSEMBLY_UNQUALIFIED.step',10)]:
              solids=cq.importers.importStep(str(root/filename)).solids().vals()
              assert len(solids)==count,(filename,len(solids))
              assert all(s.isValid() for s in solids)
              print('Verified STEP reimport:',filename,count,'solids')
          PY
      - name: Render source-derived CAD previews
        run: python tools/render_v17.py
      - name: Sync V1.7 digital outputs to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A hardware/cad/v17_generated
          if git diff --cached --quiet; then
            echo 'V1.7 already current.'
          else
            git commit -m 'Generate V1.7 7008AWDB mated layout CAD Gate A [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OpenEQMount-V17-ThreeAxis-UNQUALIFIED-GateA
          path: |
            hardware/cad/v17_generated/*.step
            hardware/cad/v17_generated/*.stl
            hardware/cad/v17_generated/*.json
            hardware/cad/v17_generated/*.png
          if-no-files-found: error
