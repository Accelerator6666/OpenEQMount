name: V0.2 CAD STEP/STL build
on:
  workflow_dispatch:
  push:
    paths:
      - 'hardware/cad/**'
      - '.github/workflows/cad-build.yml'
jobs:
  build-cad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CadQuery
        run: python -m pip install 'cadquery>=2.5,<3'
      - name: Generate 35-degree concept STEP and STL
        run: python hardware/cad/generate_v02.py --latitude 35 --out hardware/cad/generated
      - name: Upload generated artifacts (concept, not manufacturing files)
        uses: actions/upload-artifact@v4
        with:
          name: OpenEQMount-v02-concept-cad
          path: |
            hardware/cad/generated/*.step
            hardware/cad/generated/*.json
          if-no-files-found: error
