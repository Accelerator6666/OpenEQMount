name: V0.5 DfAM polar wedge CAD
on:
  workflow_dispatch:
  push:
    paths:
      - 'hardware/cad/generate_v05.py'
      - 'tools/dfam_gate_v05.py'
      - 'tests/test_v05_polar_wedge.py'
      - 'docs/mechanical-v05-polar-base.md'
      - '.github/workflows/cad-v05.yml'
  pull_request:
    paths:
      - 'hardware/cad/generate_v05.py'
      - 'tools/dfam_gate_v05.py'
      - 'tests/test_v05_polar_wedge.py'
      - '.github/workflows/cad-v05.yml'
permissions:
  contents: write
concurrency:
  group: cad-v05-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate-a-polar-wedge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CAD digital-check dependencies
        run: python -m pip install 'cadquery>=2.5,<3' pytest trimesh
      - name: Exercise range endpoints and RA orientation
        run: python -m pytest -q tests/test_v05_polar_wedge.py
      - name: Generate V0.5 CAD STEP and bed-oriented STL
        run: python hardware/cad/generate_v05.py --latitude 35 --out hardware/cad/v05_generated
      - name: DfAM Gate A only — not qualified for observing
        run: python tools/dfam_gate_v05.py --dir hardware/cad/v05_generated --report hardware/cad/v05_generated/dfam-gate-report.json
      - name: Generate optional CAD preview
        continue-on-error: true
        run: |
          python -m pip install vtk
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python tools/render_v05.py
          else
            python tools/render_v05.py
          fi
      - name: Sync V0.5 files to the main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A hardware/cad/v05_generated
          if git diff --cached --quiet; then
            echo 'V0.5 CAD files already current.'
          else
            git commit -m 'Generate V0.5 polar wedge STEP STL [skip ci]'
            git push origin HEAD:main
          fi
      - name: Attach unqualified V0.5 bench CAD
        uses: actions/upload-artifact@v4
        with:
          name: OpenEQMount-V05-Gate-A-UNQUALIFIED
          path: |
            hardware/cad/v05_generated/*.step
            hardware/cad/v05_generated/*.stl
            hardware/cad/v05_generated/*.json
            hardware/cad/v05_generated/*.png
          if-no-files-found: error
