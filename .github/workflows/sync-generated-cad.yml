name: Sync generated CAD files to GitHub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-generated-cad.yml'
      - 'hardware/cad/generate_v02.py'
      - 'hardware/cad/generate_v03.py'
      - 'hardware/cad/params.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-cad-main
  cancel-in-progress: false

jobs:
  regenerate-and-commit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CadQuery and test dependencies
        run: python -m pip install 'cadquery>=2.5,<3' pytest
      - name: Check mechanics
        run: python -m pytest -q tests/test_v03_mechanics.py
      - name: Generate V0.2 conceptual assembly
        run: python hardware/cad/generate_v02.py --latitude 35 --out hardware/cad/generated
      - name: Generate V0.3 printable interfaces
        run: python hardware/cad/generate_v03.py --out hardware/cad/v03_generated
      - name: Commit generated source-controlled CAD outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A hardware/cad/generated hardware/cad/v03_generated
          if git diff --cached --quiet; then
            echo 'Generated CAD outputs already match repository.'
          else
            git commit -m 'Generate and sync V0.2/V0.3 CAD files [skip ci]'
            git push origin HEAD:main
          fi
      - name: Archive full CAD deliverables
        uses: actions/upload-artifact@v4
        with:
          name: OpenEQMount-CAD-v02-v03-GitHub
          path: |
            hardware/cad/generated/
            hardware/cad/v03_generated/
          if-no-files-found: error
