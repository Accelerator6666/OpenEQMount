name: Import OpenEQMount V0.3 source and CAD
on:
  push:
    paths:
      - '.bootstrap/opensource.tar.xz.b64'
      - '.github/workflows/import-v03.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack source archive
        shell: bash
        run: |
          python - <<'PY'
          import base64, lzma, io, tarfile
          from pathlib import Path
          source = Path(".bootstrap/opensource.tar.xz.b64")
          data = lzma.decompress(base64.b64decode(source.read_text(encoding="ascii").strip()))
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:") as archive:
              for member in archive.getmembers():
                  p = Path(member.name)
                  if p.is_absolute() or ".." in p.parts or member.issym() or member.islnk():
                      raise RuntimeError(f"Unsafe archive member: {member.name}")
              archive.extractall(path=".", filter="data")
          readme=Path("README.md")
          s=readme.read_text(encoding="utf-8").replace(
             "**当前版本：V0.2 / 机械布局概念，未经过制造与负载验证。**",
             "**当前版本：V0.3 / 3D 打印机械接口试装阶段，尚未通过负载验证。**")
          readme.write_text(s,encoding="utf-8")
          PY
      - name: Commit restored project sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import V0.1-V0.3 source, docs, CAD generators and CI"
            git push
          fi
      - name: Install CAD generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1
          python -m pip install --upgrade pip
          python -m pip install 'cadquery>=2.5,<3' pytest vtk
      - name: Verify sources
        run: |
          python -m unittest discover -s tests -v
          python -m pytest -q tests/test_v03_mechanics.py
      - name: Generate V0.2 and V0.3 CAD models
        run: |
          python hardware/cad/generate_v02.py --latitude 35 --out hardware/cad/generated
          python hardware/cad/generate_v03.py --out hardware/cad/v03_generated
          xvfb-run -a python tools/render_cad_preview.py
          xvfb-run -a python tools/render_v03.py
      - name: Commit generated STEP, STL and previews
        shell: bash
        run: |
          git add hardware/cad/generated hardware/cad/v03_generated
          if ! git diff --cached --quiet; then
            git commit -m "Build V0.2/V0.3 STEP STL previews and fit gauges"
            git push
          fi
      - name: Publish CAD build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenEQMount-V0.3-complete-CAD
          path: |
            hardware/cad/generated/**
            hardware/cad/v03_generated/**
          if-no-files-found: warn
